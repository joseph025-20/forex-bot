name: Daily Forex Email Report

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  send-report:
    runs-on: ubuntu-latest

    steps:
      - name: Download project code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate and email forex report
        env:
          TD_API_KEY: ${{ secrets.TD_API_KEY }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          FOREX_FROM_EMAIL: ${{ secrets.FOREX_FROM_EMAIL }}
          FOREX_APP_PASSWORD: ${{ secrets.FOREX_APP_PASSWORD }}
          FOREX_TO_EMAILS: ${{ secrets.FOREX_TO_EMAILS }}
        run: python forex.py
